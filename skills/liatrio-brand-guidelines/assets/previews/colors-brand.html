<!doctype html>
<!-- @dsCard group="Colors" name="Brand colors" subtitle="Bright green, primary green, violet, lime + flame gradient" viewport="700x320" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 26px; gap: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sw {
    border-radius: 10px; padding: 14px 16px; height: 88px;
    display: flex; flex-direction: column; justify-content: space-between;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .sw .nm { font-family: "Space Grotesk", sans-serif; font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
  .sw .hx { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; opacity: 0.78; }
  .sw .role { font-family: "Space Grotesk", sans-serif; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.55; font-weight: 500; }
  .feature {
    grid-column: span 2; height: 110px;
    background: linear-gradient(160deg, #24AE1D 0%, #89DF00 100%);
    color: #0a0a0a;
    border: 1px solid rgba(0,0,0,0.18);
  }
  .feature .nm { font-size: 16px; font-weight: 700; }
</style></head>
<body>
<div class="card">
  <div class="grid">
    <div class="sw feature">
      <div class="role">Brand gradient · flame</div>
      <div>
        <div class="nm">Primary → Bright</div>
        <div class="hx">linear-gradient(160deg, #24AE1D, #89DF00)</div>
      </div>
    </div>

    <div class="sw" style="background:#24AE1D; color:#0a0a0a;">
      <div class="role">Hero · most prominent</div>
      <div><div class="nm">Primary Green</div><div class="hx">#24AE1D</div></div>
    </div>
    <div class="sw" style="background:#89DF00; color:#0a0a0a;">
      <div class="role">Accent · sparingly</div>
      <div><div class="nm">Bright Green</div><div class="hx">#89DF00</div></div>
    </div>

    <div class="sw" style="background:#111111; color:#fff;">
      <div class="role">Primary text · dark</div>
      <div><div class="nm">Grey 800</div><div class="hx">#111111</div></div>
    </div>
    <div class="sw" style="background:#FFFFFF; color:#111; border-color:#2a3036;">
      <div class="role">Light bg · light fg</div>
      <div><div class="nm">White</div><div class="hx">#FFFFFF</div></div>
    </div>
  </div>
</div>
</body></html>
