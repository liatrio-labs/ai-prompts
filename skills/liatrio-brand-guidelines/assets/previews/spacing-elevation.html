<!doctype html>
<!-- @dsCard group="Spacing" name="Elevation & shadows" subtitle="shadow-sm/md/lg + brand glow-accent" viewport="700x200" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 28px; gap: 14px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .e {
    background: #1E2327; border: 1px solid #2a3036; border-radius: 12px;
    height: 110px; padding: 14px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .e .nm { font-size: 12px; font-weight: 600; color: #fff; }
  .e .meta { font-family: var(--font-mono); font-size: 10px; color: #999; letter-spacing: 0.04em; }
  .e1 { box-shadow: 0 1px 2px rgba(0,0,0,0.4); }
  .e2 { box-shadow: 0 6px 24px rgba(0,0,0,0.45); }
  .e3 { box-shadow: 0 24px 60px rgba(0,0,0,0.55); }
  .e4 { box-shadow: 0 0 0 1px rgba(137,223,0,0.25), 0 8px 30px rgba(137,223,0,0.18); border-color: rgba(137,223,0,0.35); }
</style></head>
<body>
<div class="card">
  <div class="label">Elevation — borders first, shadows for floating UI, glow for brand-active</div>
  <div class="grid">
    <div class="e e1"><div class="nm">shadow-sm</div><div class="meta">inputs · subtle lift</div></div>
    <div class="e e2"><div class="nm">shadow-md</div><div class="meta">menus · toasts</div></div>
    <div class="e e3"><div class="nm">shadow-lg</div><div class="meta">modals · drawers</div></div>
    <div class="e e4"><div class="nm" style="color:#89DF00;">glow-accent</div><div class="meta">active · CTA · focused</div></div>
  </div>
</div>
</body></html>
